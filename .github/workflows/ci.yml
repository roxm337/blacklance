name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml aiohttp beautifulsoup4 dnspython lxml python-dotenv litellm h2
          pip install pytest pytest-asyncio build "setuptools<81"

      - name: Compile check (3.10 syntax gate)
        # Catches version-gated syntax (PEP-701 f-strings, match edge
        # cases) that 3.12 accepts but the 3.10/3.11 matrix must run.
        run: |
          python -m py_compile $(git ls-files '*.py')

      - name: Config YAML lint
        # config.yaml is operator-local and gitignored, so fresh checkouts
        # only carry the example — lint what exists.
        run: |
          python - <<'EOF'
          import pathlib, yaml
          files = [p for p in ("config.example.yaml", "config.yaml")
                   if pathlib.Path(p).exists()]
          assert files, "no config file found"
          for f in files:
              yaml.safe_load(open(f))
          print("configs parse:", ", ".join(files))
          EOF

      - name: Config coverage (shipped config must be warning-lean)
        run: |
          python orchestrator.py -t example.com --check-config

      - name: Run test suite (non-GUI)
        # GUI test files are ignored here because this job does not
        # install PySide6; they run in the test-gui job instead.
        run: |
          python -m pytest -q \
            --ignore=tests/test_gui_app.py \
            --ignore=tests/test_gui_graph.py \
            --ignore=tests/test_gui_enhancements.py \
            --ignore=tests/test_gui_schema_screen.py \
            --ignore=tests/test_results_integrity.py

      - name: Build and smoke-test installed wheel
        env:
          PYTHON_DOTENV_DISABLED: "1"
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: |
          python -m build --wheel --outdir "$RUNNER_TEMP/osint-wheel"
          python scripts/check_wheel.py "$RUNNER_TEMP"/osint-wheel/*.whl

  test-gui:
    # Scanner save/load helpers live in the GUI tests; ignoring them let
    # config-key drift go undetected. Offscreen platform, no display.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries
        # PySide6 wheels link system Qt libs (glib, X11, NSS for WebEngine)
        # that bare ubuntu images do not ship; without them `import gui.app`
        # fails at collection. Per-package `|| true` keeps this working when
        # future ubuntu releases rename a package.
        run: |
          sudo apt-get update
          for p in libglib2.0-0t64 libgl1 libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libatspi2.0-0t64 libx11-6 libxcb1 libxext6 libxi6 libxtst6 libxkbfile1 libxcursor1 libxss1 libxshmfence1 libx11-xcb1; do
            sudo apt-get install -y --no-install-recommends "$p" || true
          done

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml aiohttp beautifulsoup4 dnspython lxml python-dotenv litellm h2
          pip install pytest pytest-asyncio PySide6 "gravis==0.1.0" "setuptools<81"

      - name: Run GUI tests (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q \
            tests/test_gui_app.py \
            tests/test_gui_graph.py \
            tests/test_gui_enhancements.py \
            tests/test_gui_schema_screen.py \
            tests/test_results_integrity.py
